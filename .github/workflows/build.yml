name: build

on:
  push:
    branches: [main, master]
    tags: ['[0-9a-f]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CFLAGS: -std=gnu99 -O2 -Wall -Wextra

jobs:
  windows:
    name: Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 装工具链（mingw-w64 + llvm-mingw）
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-i686 gcc-mingw-w64-x86-64

          LM=llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64
          curl -fsSL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/${LM}.tar.xz"
          sudo tar -xJf /tmp/llvm-mingw.tar.xz -C /opt
          echo "/opt/${LM}/bin" >> "$GITHUB_PATH"

      - name: 编译 windows/386 与 windows/amd64
        run: |
          set -eux
          mkdir -p dist

          WFLAGS="$CFLAGS -Wl,--dynamicbase -Wl,--nxcompat"

          build() {
            arch="$1"; cc="$2"; rc="$3"
            echo "=== windows/$arch ==="
            "$rc" dming.rc -O coff -o dming_res.o
            "$cc" $WFLAGS -o "dist/dming-windows-$arch.exe" \
              dming.c dming_res.o -lshell32 -luser32
          }
          build 386   i686-w64-mingw32-gcc   i686-w64-mingw32-windres
          build amd64 x86_64-w64-mingw32-gcc x86_64-w64-mingw32-windres

      - name: 编译 windows/arm64
        run: |
          set -eux
          CC_A=aarch64-w64-mingw32-clang
          WFLAGS="$CFLAGS -Wl,--dynamicbase -Wl,--nxcompat"
          command -v "$CC_A" >/dev/null || { echo "找不到 $CC_A"; exit 1; }

          if command -v aarch64-w64-mingw32-windres >/dev/null 2>&1; then
            RC_A=aarch64-w64-mingw32-windres
          elif command -v llvm-windres >/dev/null 2>&1; then
            RC_A="llvm-windres --target=aarch64-w64-mingw32"
          else
            RC_A=""
          fi

          RES=""
          if [ -n "$RC_A" ]; then
            echo "=== 资源编译器: $RC_A ==="
            $RC_A dming.rc -O coff -o dming_res.o
            RES=dming_res.o
          else
            echo "::warning::没有 aarch64 的 windres，windows/arm64 将不含图标和版本信息"
          fi

          echo "=== windows/arm64 ==="
          "$CC_A" $WFLAGS -o dist/dming-windows-arm64.exe dming.c $RES -lshell32 -luser32

      - name: 校验版本号两处一致
        run: |
          set -eux
          V="$(sed -n 's/^#define APP_VERSION "\([0-9.]*\)".*/\1/p' dming.c)"
          test -n "$V" || { echo "::error::没能从 dming.c 里读出 APP_VERSION"; exit 1; }
          echo "dming.c APP_VERSION = $V"

          DOTTED="$(printf '%s' "$V" | tr . ,)"
          grep -qE "^FILEVERSION[[:space:]]+$DOTTED,0" dming.rc \
            || { echo "::error::dming.rc 的 FILEVERSION 和 $V 对不上"; exit 1; }
          grep -qE "^PRODUCTVERSION[[:space:]]+$DOTTED,0" dming.rc \
            || { echo "::error::dming.rc 的 PRODUCTVERSION 和 $V 对不上"; exit 1; }
          grep -q "\"$V.0\"" dming.rc \
            || { echo "::error::dming.rc 的字符串版本号和 $V 对不上"; exit 1; }
          echo "OK: 两处版本一致"

      - name: 校验 exe 里真的有图标资源
        run: |
          set -eux
          cat > /tmp/check_pe.py <<'PY'
          import struct, sys

          def sections(path):
              d = open(path, 'rb').read()
              assert d[:2] == b'MZ', path + ': 不是 PE'
              pe = struct.unpack_from('<I', d, 0x3C)[0]
              assert d[pe:pe + 4] == b'PE\0\0', path + ': 没有 PE 签名'
              nsec = struct.unpack_from('<H', d, pe + 6)[0]
              off = pe + 24 + struct.unpack_from('<H', d, pe + 20)[0]
              return [d[off + i*40: off + i*40 + 8].split(b'\0')[0].decode()
                      for i in range(nsec)]

          bad = [p for p in sys.argv[1:] if '.rsrc' not in sections(p)]
          if bad:
              print('缺少 .rsrc（图标/版本信息没链接进去）:', ' '.join(bad),
                    file=sys.stderr)
              sys.exit(1)
          PY

          python3 /tmp/check_pe.py \
            dist/dming-windows-386.exe \
            dist/dming-windows-amd64.exe

          if ! python3 /tmp/check_pe.py dist/dming-windows-arm64.exe; then
            echo "::warning::windows/arm64 的 exe 没有图标资源（llvm-mingw 没提供 windres）"
          fi

      - name: 组绿色版（中文说明直接写在 bash heredoc 里）
        run: |
          set -eux
          P=dist/dming-portable
          mkdir -p "$P"
          cp dist/dming-windows-amd64.exe "$P/dming.exe"
          cp dist/dming-windows-386.exe   "$P/dming-386.exe"
          cp dist/dming-windows-arm64.exe "$P/dming-arm64.exe"
          printf '高一(1)班\n' > "$P/class.txt"
          printf '张三\n李四\n王五\n赵六\n' > "$P/p.txt"
          cat > "$P/使用说明.txt" <<'EOF'
          免安装版，解压即用。

          1. 把 p.txt 换成你的名单（每行一个姓名）。
          2. 班级名称写在 class.txt 里。
          3. 双击 dming.exe 即可点名，页面会用默认浏览器打开。

          选哪个 exe：
            dming.exe        64 位 Windows（绝大多数机器，默认用这个）
            dming-386.exe    32 位 Windows
            dming-arm64.exe  ARM64 Windows（骁龙本等）

          双击 dming.exe 如果提示"不是有效的 Win32 应用程序"，说明系统是 32 位，
          把 dming-386.exe 改名成 dming.exe 再双击即可。

          命令行参数：
            dming.exe -keep        保留生成的 HTML，不自动删除
            dming.exe -no-open     只生成 HTML，不打开浏览器
            dming.exe -delay 8s    延长清理前的等待时间

          注意 p.txt 和 class.txt 必须和 exe 放在同一个文件夹里。
          EOF

      - name: 打包 zip
        run: |
          set -eux
          cd dist
          zip -r -q dming-windows-portable.zip dming-portable
          zip -q dming-windows-exe.zip \
            dming-windows-386.exe dming-windows-amd64.exe dming-windows-arm64.exe
          unzip -l dming-windows-portable.zip

      - uses: actions/upload-artifact@v7
        with:
          name: dming-windows
          if-no-files-found: error
          path: |
            dist/dming-windows-386.exe
            dist/dming-windows-amd64.exe
            dist/dming-windows-arm64.exe
            dist/dming-portable/
            dist/*.zip

  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 装 zig
        run: |
          set -eux
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz
          tar -xJf /tmp/zig.tar.xz -C "$HOME"
          mv "$HOME/zig-x86_64-linux-0.17.1" "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: 编译 4 个架构
        run: |
          set -eux
          mkdir -p dist
          for pair in x86_64-linux-musl:amd64 x86-linux-musl:386 arm-linux-musleabihf:arm aarch64-linux-musl:arm64; do
            triple="${pair%%:*}"
            arch="${pair##*:}"
            zig cc -target "$triple" $CFLAGS -o "dist/dming-linux-$arch" dming.c
            file "dist/dming-linux-$arch"
          done

      - name: 冒烟测试（真跑 amd64 产物）
        run: |
          set -eux
          T="$(mktemp -d)"
          cp dist/dming-linux-amd64 "$T/dming"
          printf 'Alice\nBob\n\n  Carol  \n张三\r\n' > "$T/p.txt"
          printf '14\n' > "$T/class.txt"

          ( cd / && "$T/dming" -no-open )

          page="$(ls "$T"/DMING*.html)"
          echo "生成的页面: $page"
          grep -q '<title>14班点名</title>' "$page"
          V="$(sed -n 's/^#define APP_VERSION "\([0-9.]*\)".*/\1/p' dming.c)"
          grep -q "version $V" "$page"
          grep -q 'let originalStudents = \["Alice","Bob","Carol","张三"\]' "$page"
          echo "OK: 页面内容正确"

      - uses: actions/upload-artifact@v7
        with:
          name: dming-linux
          if-no-files-found: error
          path: dist/dming-linux-*

  android:
    name: android-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 编译 android/arm64（NDK）
        run: |
          set -eux
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d /usr/local/lib/android/sdk/ndk/*/ | tail -1)"
          fi
          echo "NDK: $NDK"
          CC="${NDK%/}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          ls -la "$CC"
          mkdir -p dist
          "$CC" $CFLAGS -s -o dist/dming-android-arm64 dming.c
          file dist/dming-android-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: dming-android-arm64
          if-no-files-found: error
          path: dist/dming-android-arm64

  release:
    name: 发布 Release
    needs: [windows, linux, android]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 判断构建是否完整
        id: complete
        env:
          R_WINDOWS: ${{ needs.windows.result }}
          R_LINUX: ${{ needs.linux.result }}
          R_ANDROID: ${{ needs.android.result }}
        run: |
          set -euo pipefail
          echo "windows=$R_WINDOWS linux=$R_LINUX android=$R_ANDROID"

          : > incomplete.txt
          for pair in "Windows:$R_WINDOWS" "Linux:$R_LINUX" "Android:$R_ANDROID"; do
            name="${pair%%:*}"
            result="${pair##*:}"
            if [ "$result" != "success" ]; then
              printf -- '- **%s**：%s\n' "$name" "$result" >> incomplete.txt
            fi
          done

          if [ -s incomplete.txt ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::warning::有平台没构建成功，本次将发布为 Pre-Release："
            cat incomplete.txt
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "全部平台构建成功，发布正式 Release"
          fi

      - name: 决定 tag 名
        id: tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git rev-parse --short=7 HEAD)"
          fi
          if ! printf '%s' "$TAG" | grep -qE '^[0-9a-f]{4,40}$'; then
            echo "::error::tag 名 '$TAG' 不是十六进制短 SHA"
            exit 1
          fi
          if ! FULL="$(git rev-parse --verify --quiet "${TAG}^{commit}")"; then
            echo "::error::tag 名 '$TAG' 在本仓库里找不到对应的提交"
            exit 1
          fi
          FULL="$(git rev-parse "$FULL")"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "full=$FULL"   >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 "$FULL")" >> "$GITHUB_OUTPUT"

      - name: 下载全部构建产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
        continue-on-error: true

      - name: 整理发布文件
        run: |
          set -eux
          mkdir -p release
          for f in dming-windows-portable.zip dming-windows-exe.zip; do
            if [ -f "artifacts/dming-windows/$f" ]; then
              cp "artifacts/dming-windows/$f" release/
            else
              echo "缺少 $f（windows job 没成功）"
            fi
          done
          for dir in artifacts/dming-linux artifacts/dming-android-*; do
            [ -d "$dir" ] || continue
            for f in "$dir"/*; do
              [ -f "$f" ] && cp "$f" release/
            done
          done
          echo "--- 待发布文件 ---"
          ls -la release/
          count="$(find release -type f | wc -l)"
          echo "共 $count 个文件"
          echo "count=$count" >> "$GITHUB_OUTPUT"
        id: collect

      - name: 生成 Release 说明
        env:
          FULL_SHA: ${{ steps.tag.outputs.full }}
          PRERELEASE: ${{ steps.complete.outputs.prerelease }}
        run: |
          set -euo pipefail
          SUBJECT="$(git log -1 --pretty=%s "$FULL_SHA")"
          BODY="$(git log -1 --pretty=%b "$FULL_SHA")"
          AUTHOR="$(git log -1 --pretty=%an "$FULL_SHA")"
          DATE="$(git log -1 --pretty=%ad --date=short "$FULL_SHA")"

          {
            if [ "$PRERELEASE" = "true" ]; then
              echo "> [!WARNING]"
              echo "> **这是一个不完整的预发布版本。**"
              echo "> 下列平台没有构建成功，对应的产物是缺失的，或者根本不存在："
              echo ">"
              sed 's/^-/> -/' incomplete.txt
              echo
            fi
            echo "提交 \`$FULL_SHA\` —— $DATE by $AUTHOR"
            echo
            echo "**$SUBJECT**"
            echo
            if [ -n "$BODY" ]; then
              echo "$BODY"
              echo
            fi
            echo "## 下载哪个"
            echo
            echo "| 文件 | 说明 |"
            echo "|---|---|"
            echo "| \`dming-windows-portable.zip\` | **推荐**。解压即用，把 \`p.txt\` 换成你的名单，双击 \`dming.exe\` |"
            echo "| \`dming-windows-exe.zip\` | 只要 exe（386 / amd64 / arm64），自己配 \`p.txt\`、\`class.txt\` |"
            echo "| \`dming-linux-amd64\` / \`dming-linux-arm64\` | Linux 64 位 |"
            echo "| \`dming-linux-386\` / \`dming-linux-arm\` | Linux 32 位（x86 / ARM） |"
            echo "| \`dming-android-arm64\` | Termux |"
            echo
            echo "绿色版里有三个 exe：32 位系统用 \`dming-386.exe\`，ARM64 设备用 \`dming-arm64.exe\`。"
            echo
            echo "> Linux 首次运行需要加执行权限：\`chmod +x dming-*\`"
            echo
            echo "绿色版里的 \`p.txt\` 是示例名单（张三、李四、王五、赵六），不含任何真实数据。"
          } > release_body.md

          cat release_body.md

      - name: 一个产物都没有就别建 Release 了
        if: steps.collect.outputs.count == '0'
        run: |
          echo "::error::所有平台都没构建成功，没有可发布的东西"
          exit 1

      - name: 断言该有的产物一个不少
        env:
          R_WINDOWS: ${{ needs.windows.result }}
          R_LINUX: ${{ needs.linux.result }}
          R_ANDROID: ${{ needs.android.result }}
        run: |
          set -uo pipefail
          missing=""
          want() {
            if [ ! -f "release/$1" ]; then
              missing="$missing $1"
            fi
            return 0
          }

          if [ "$R_WINDOWS" = success ]; then
            want dming-windows-portable.zip
            want dming-windows-exe.zip
          fi
          if [ "$R_LINUX" = success ]; then
            want dming-linux-amd64
            want dming-linux-386
            want dming-linux-arm
            want dming-linux-arm64
          fi
          if [ "$R_ANDROID" = success ]; then
            want dming-android-arm64
          fi

          if [ -n "$missing" ]; then
            echo "::error::构建报告成功，但产物缺失:$missing"
            echo "常见原因：artifact 下载失败（含哈希不匹配）、artifact 命名和收集规则对不上、"
            echo "或者某个上传步骤被静默跳过。"
            exit 1
          fi
          echo "OK: 该有的产物都在"

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.tag.outputs.short }}
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release_body.md
          files: release/*
          draft: false
          prerelease: ${{ steps.complete.outputs.prerelease }}
          fail_on_unmatched_files: true
