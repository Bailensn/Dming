name: build

# 什么时候跑：
#   - 推送到 main / master  -> 构建全部平台，全绿之后【自动发 Release】
#   - 手动：Actions 页面 Run workflow  -> 同上，也会发 Release
#   - PR                    -> 只构建验证，不发 Release
#   - 推 tag                -> 也发，Release 挂在你推的那个 tag 上
#
# 发版是自动的，不用手动打 tag：tag 名就是本次提交的 7 位短 SHA（如 3d462a5），
# 由 release job 自己算并创建。任何一个平台构建失败，Release 就不会发。
on:
  push:
    branches: [main, master]
    tags: ['[0-9a-f]*']
  pull_request:
  workflow_dispatch:

# 默认只读；发 Release 需要写权限，在 release job 里单独提权。
permissions:
  contents: read

env:
  CFLAGS: -std=c99 -O2 -Wall -Wextra

jobs:
  # ===========================================================================
  # Windows：在 ubuntu 上用 mingw 交叉编译。
  #
  # 放 ubuntu 而不是 windows runner，有两个好处：
  #   1. runner 更快
  #   2. 打包（绿色版目录 + 含中文文件名的 zip）走 bash + zip，
  #      完全没有 PowerShell 那套编码坑
  #
  # Debian/Ubuntu 的 mingw-w64 只提供 i686 和 x86_64，
  # aarch64 得用 llvm-mingw。
  # ===========================================================================
  windows:
    name: Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装工具链（mingw-w64 + llvm-mingw）
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-i686 gcc-mingw-w64-x86-64

          # aarch64 用 llvm-mingw，版本写死以保证构建可复现
          LM=llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64
          curl -fsSL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/${LM}.tar.xz"
          sudo tar -xJf /tmp/llvm-mingw.tar.xz -C /opt
          echo "/opt/${LM}/bin" >> "$GITHUB_PATH"

      - name: 生成 page.h
        run: python3 src/mkpage.py

      - name: 编译 windows/386 与 windows/amd64
        run: |
          set -eux
          mkdir -p dist
          build() {
            arch="$1"; cc="$2"; rc="$3"
            echo "=== windows/$arch ==="
            ( cd src && "$rc" dming.rc -O coff -o dming_res.o )
            "$cc" $CFLAGS -s -o "dist/dming-windows-$arch.exe" \
              src/dming.c src/dming_res.o -luser32
          }
          build 386   i686-w64-mingw32-gcc   i686-w64-mingw32-windres
          build amd64 x86_64-w64-mingw32-gcc x86_64-w64-mingw32-windres

      - name: 编译 windows/arm64
        run: |
          set -eux
          CC_A=aarch64-w64-mingw32-clang
          command -v "$CC_A" >/dev/null || { echo "找不到 $CC_A"; exit 1; }

          # llvm-mingw 通常提供 <triple>-windres；没有就退回 llvm-windres
          if command -v aarch64-w64-mingw32-windres >/dev/null 2>&1; then
            RC_A=aarch64-w64-mingw32-windres
          elif command -v llvm-windres >/dev/null 2>&1; then
            RC_A="llvm-windres --target=aarch64-w64-mingw32"
          else
            RC_A=""
          fi

          RES=""
          if [ -n "$RC_A" ]; then
            echo "=== 资源编译器: $RC_A ==="
            ( cd src && $RC_A dming.rc -O coff -o dming_res.o )
            RES=src/dming_res.o
          else
            echo "::warning::没有 aarch64 的 windres，windows/arm64 将不含图标和版本信息"
          fi

          echo "=== windows/arm64 ==="
          "$CC_A" $CFLAGS -s -o dist/dming-windows-arm64.exe src/dming.c $RES -luser32

      - name: 校验三个 exe 里都真的有图标资源
        run: |
          python3 tools/check-pe.py \
            dist/dming-windows-386.exe \
            dist/dming-windows-amd64.exe \
            dist/dming-windows-arm64.exe

      - name: 组绿色版（中文说明直接写在 bash heredoc 里）
        run: |
          set -eux
          P=dist/dming-portable
          mkdir -p "$P"
          cp dist/dming-windows-amd64.exe "$P/dming.exe"
          cp dist/dming-windows-386.exe   "$P/dming-386.exe"
          cp dist/dming-windows-arm64.exe "$P/dming-arm64.exe"
          cp class.txt "$P/"
          cp p.sample.txt "$P/p.txt"
          cp assets/dming.ico "$P/"
          cat > "$P/使用说明.txt" <<'EOF'
          免安装版，解压即用。

          1. 把 p.txt 换成你的名单（每行一个姓名）。
          2. 班级名称写在 class.txt 里。
          3. 双击 dming.exe 即可点名，页面会用默认浏览器打开。

          选哪个 exe：
            dming.exe        64 位 Windows（绝大多数机器，默认用这个）
            dming-386.exe    32 位 Windows
            dming-arm64.exe  ARM64 Windows（骁龙本等）

          双击 dming.exe 如果提示"不是有效的 Win32 应用程序"，说明系统是 32 位，
          把 dming-386.exe 改名成 dming.exe 再双击即可。

          命令行参数：
            dming.exe -keep        保留生成的 HTML，不自动删除
            dming.exe -no-open     只生成 HTML，不打开浏览器
            dming.exe -delay 8s    延长清理前的等待时间

          注意 p.txt 和 class.txt 必须和 exe 放在同一个文件夹里。
          EOF

      - name: 打包 zip
        run: |
          set -eux
          cd dist
          zip -r -q dming-windows-portable.zip dming-portable
          zip -q dming-windows-exe.zip \
            dming-windows-386.exe dming-windows-amd64.exe dming-windows-arm64.exe
          unzip -l dming-windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dming-windows
          if-no-files-found: error
          path: |
            dist/dming-windows-386.exe
            dist/dming-windows-amd64.exe
            dist/dming-windows-arm64.exe
            dist/dming-portable/
            dist/*.zip

  # ===========================================================================
  # Linux 各架构。全部静态链接，免得依赖构建机的 glibc 版本。
  # ===========================================================================
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, arch: amd64, cc: gcc,                     apt: "" }
          - { name: linux-386,   arch: 386,   cc: "gcc -m32",              apt: gcc-multilib }
          - { name: linux-arm,   arch: arm,   cc: arm-linux-gnueabihf-gcc, apt: gcc-arm-linux-gnueabihf }
          - { name: linux-arm64, arch: arm64, cc: aarch64-linux-gnu-gcc,   apt: gcc-aarch64-linux-gnu }
    steps:
      - uses: actions/checkout@v4

      - name: 生成 page.h
        run: python3 src/mkpage.py

      - name: 装交叉编译器
        if: matrix.apt != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.apt }}

      - name: 编译 ${{ matrix.name }}
        run: |
          set -eux
          mkdir -p dist
          ${{ matrix.cc }} $CFLAGS -static -s -o "dist/dming-${{ matrix.name }}" src/dming.c
          file "dist/dming-${{ matrix.name }}"

      # 原生架构就真跑一遍，算端到端冒烟测试
      - name: 冒烟测试（只在 linux-amd64 上跑）
        if: matrix.arch == 'amd64'
        run: |
          set -eux
          T="$(mktemp -d)"
          cp dist/dming-linux-amd64 "$T/dming"
          printf 'Alice\nBob\n\n  Carol  \n张三\r\n' > "$T/p.txt"
          printf '14\n' > "$T/class.txt"

          # 故意 cd 到别处，验证它读的是 exe 所在目录而不是当前目录
          ( cd / && "$T/dming" -no-open )

          page="$(ls "$T"/DMING*.html)"
          echo "生成的页面: $page"
          grep -q '<title>14班点名</title>' "$page"
          grep -q 'version 3.4.3' "$page"
          grep -q 'let originalStudents = \["Alice","Bob","Carol","张三"\]' "$page"
          echo "OK: 页面内容正确"

      - uses: actions/upload-artifact@v4
        with:
          name: dming-${{ matrix.name }}
          if-no-files-found: error
          path: dist/dming-${{ matrix.name }}

  # ===========================================================================
  # Android / Termux。用 NDK 自带的 clang。
  # 注意不能静态链接：Android 内核只认 PIE，需要 bionic 的动态装载器。
  # ===========================================================================
  android:
    name: android-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成 page.h
        run: python3 src/mkpage.py

      - name: 编译 android/arm64（NDK）
        run: |
          set -eux
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d /usr/local/lib/android/sdk/ndk/*/ | tail -1)"
          fi
          echo "NDK: $NDK"
          CC="${NDK%/}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          ls -la "$CC"
          mkdir -p dist
          "$CC" $CFLAGS -s -o dist/dming-android-arm64 src/dming.c
          file dist/dming-android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: dming-android-arm64
          if-no-files-found: error
          path: dist/dming-android-arm64

  # ===========================================================================
  # macOS：必须在 macOS runner 上编（要 Apple SDK）。
  # macos-latest 本身是 arm64，用 -arch 一次编出两个架构。
  # ===========================================================================
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成 page.h
        run: python3 src/mkpage.py

      - name: 编译 darwin/amd64 与 darwin/arm64
        run: |
          set -eux
          mkdir -p dist
          for a in amd64 arm64; do
            echo "=== darwin/$a ==="
            clang $CFLAGS -arch "$a" -s -o "dist/dming-darwin-$a" src/dming.c
            file "dist/dming-darwin-$a"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dming-darwin
          if-no-files-found: error
          path: |
            dist/dming-darwin-amd64
            dist/dming-darwin-arm64

  # ===========================================================================
  # 汇总产物发 Release。
  #
  # 全部平台都成功 -> 正式 Release
  # 有平台失败     -> 照样发，但标记成 Pre-Release（并列出哪些平台没出来）
  #
  # 所以这里的 if 用 !cancelled() 而不是默认的 success()：
  # 不写的话，只要有一个构建 job 失败，这个 job 会被整个跳过，什么都发不出来。
  # 用 ${{ }} 包起来是因为裸写 !cancelled() 时开头的 "!" 会被 YAML 当成标签。
  # ===========================================================================
  release:
    name: 发布 Release
    needs: [windows, linux, android, macos]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 判断构建是否完整
        id: complete
        env:
          R_WINDOWS: ${{ needs.windows.result }}
          R_LINUX: ${{ needs.linux.result }}
          R_ANDROID: ${{ needs.android.result }}
          R_MACOS: ${{ needs.macos.result }}
        run: |
          set -euo pipefail
          echo "windows=$R_WINDOWS linux=$R_LINUX android=$R_ANDROID macos=$R_MACOS"

          : > incomplete.txt
          for pair in "Windows:$R_WINDOWS" "Linux:$R_LINUX" "Android:$R_ANDROID" "macOS:$R_MACOS"; do
            name="${pair%%:*}"
            result="${pair##*:}"
            if [ "$result" != "success" ]; then
              printf -- '- **%s**：%s\n' "$name" "$result" >> incomplete.txt
            fi
          done

          if [ -s incomplete.txt ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::warning::有平台没构建成功，本次将发布为 Pre-Release："
            cat incomplete.txt
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "全部平台构建成功，发布正式 Release"
          fi

      - name: 决定 tag 名
        id: tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git rev-parse --short=7 HEAD)"
          fi
          if ! printf '%s' "$TAG" | grep -qE '^[0-9a-f]{4,40}$'; then
            echo "::error::tag 名 '$TAG' 不是十六进制短 SHA"
            exit 1
          fi
          if ! FULL="$(git rev-parse --verify --quiet "${TAG}^{commit}")"; then
            echo "::error::tag 名 '$TAG' 在本仓库里找不到对应的提交"
            exit 1
          fi
          FULL="$(git rev-parse "$FULL")"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "full=$FULL"   >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 "$FULL")" >> "$GITHUB_OUTPUT"

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        # 有平台失败时可能一个产物都没有，别让它把整个 job 弄挂
        continue-on-error: true

      - name: 整理发布文件
        run: |
          set -eux
          mkdir -p release
          # 用 `if [ -f ]` 逐个判断：构建不完整时某些产物本来就不存在
          for f in dming-windows-portable.zip dming-windows-exe.zip; do
            if [ -f "artifacts/dming-windows/$f" ]; then
              cp "artifacts/dming-windows/$f" release/
            else
              echo "缺少 $f（windows job 没成功）"
            fi
          done
          for dir in artifacts/dming-linux-* artifacts/dming-darwin-* artifacts/dming-android-*; do
            [ -d "$dir" ] || continue
            for f in "$dir"/*; do
              [ -f "$f" ] && cp "$f" release/
            done
          done
          echo "--- 待发布文件 ---"
          ls -la release/
          count="$(find release -type f | wc -l)"
          echo "共 $count 个文件"
          echo "count=$count" >> "$GITHUB_OUTPUT"
        id: collect

      - name: 生成 Release 说明
        env:
          FULL_SHA: ${{ steps.tag.outputs.full }}
          PRERELEASE: ${{ steps.complete.outputs.prerelease }}
        run: |
          set -euo pipefail
          SUBJECT="$(git log -1 --pretty=%s "$FULL_SHA")"
          BODY="$(git log -1 --pretty=%b "$FULL_SHA")"
          AUTHOR="$(git log -1 --pretty=%an "$FULL_SHA")"
          DATE="$(git log -1 --pretty=%ad --date=short "$FULL_SHA")"

          {
            if [ "$PRERELEASE" = "true" ]; then
              echo "> [!WARNING]"
              echo "> **这是一个不完整的预发布版本。**"
              echo "> 下列平台没有构建成功，对应的产物是缺失的，或者根本不存在："
              echo ">"
              sed 's/^-/> -/' incomplete.txt
              echo
            fi
            echo "提交 \`$FULL_SHA\` —— $DATE by $AUTHOR"
            echo
            echo "**$SUBJECT**"
            echo
            if [ -n "$BODY" ]; then
              echo "$BODY"
              echo
            fi
            echo "## 下载哪个"
            echo
            echo "| 文件 | 说明 |"
            echo "|---|---|"
            echo "| \`dming-windows-portable.zip\` | **推荐**。解压即用，把 \`p.txt\` 换成你的名单，双击 \`dming.exe\` |"
            echo "| \`dming-windows-exe.zip\` | 只要 exe（386 / amd64 / arm64），自己配 \`p.txt\`、\`class.txt\` |"
            echo "| \`dming-darwin-amd64\` / \`dming-darwin-arm64\` | macOS（Intel / Apple 芯片） |"
            echo "| \`dming-linux-amd64\` / \`dming-linux-arm64\` | Linux 64 位 |"
            echo "| \`dming-linux-386\` / \`dming-linux-arm\` | Linux 32 位（x86 / ARM） |"
            echo "| \`dming-android-arm64\` | Termux |"
            echo
            echo "绿色版里有三个 exe：32 位系统用 \`dming-386.exe\`，ARM64 设备用 \`dming-arm64.exe\`。"
            echo
            echo "> macOS / Linux 首次运行可能需要去掉隔离属性："
            echo "> \`chmod +x dming-* && xattr -d com.apple.quarantine dming-darwin-arm64\`"
            echo
            echo "绿色版里的 \`p.txt\` 是示例名单（张三、李四、王五、赵六），不含任何真实数据。"
          } > release_body.md

          cat release_body.md

      - name: 一个产物都没有就别建 Release 了
        if: steps.collect.outputs.count == '0'
        run: |
          echo "::error::所有平台都没构建成功，没有可发布的东西"
          exit 1

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.short }}
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release_body.md
          files: release/*
          draft: false
          # 构建不完整就发成 Pre-Release（GitHub 上会带 Pre-release 标记，
          # 也不会出现在 "Latest release" 里）
          prerelease: ${{ steps.complete.outputs.prerelease }}
          fail_on_unmatched_files: true
