name: build

# 什么时候跑：
#   - 推送到 main / master  -> 只构建，产物在 Actions 的 Artifacts 里
#   - 打 tag                -> 构建并自动发一个 Release
#   - 手动：仓库页面 Actions -> build -> Run workflow
#
# 发版流程（手动，避免每次改错字都发版）。
# tag 名就是提交的 7 位短 SHA，不带任何前缀：
#   git tag 56ad711
#   git push origin 56ad711
#
# 省事写法，直接用当前提交：
#   git tag "$(git rev-parse --short=7 HEAD)" && git push origin --tags
#
# 触发器用 [0-9a-f]* 匹配十六进制短 SHA。
# 注意这只能保证「看起来像 SHA」，不校验它是否真是本仓库的提交 ——
# 打错 tag 名的话 release job 里的校验会兜住并报错。
on:
  push:
    branches: [main, master]
    tags: ['[0-9a-f]*']
  pull_request:
  workflow_dispatch:

# 默认只读；发 Release 需要写权限，在 release job 里单独提权，
# 避免把这个权限给到跑第三方 action 的构建 job。
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 在云端 Windows 上编译 exe（内嵌图标），再组一个绿色版。
  # 云端 runner 是完整 Windows，cmd.exe 和 PATH 都正常，
  # 完全不受本机环境（PATH 损坏 / 没有 cmd）的影响。
  #
  # 不做安装包：纯 Go 静态二进制，绿色版双击就能用，
  # 而且 Inno 安装包会把 32 位系统 / 老版本 Win10 挡在门外。
  # ---------------------------------------------------------------------------
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 用 go.mod 里的 go 指令当最低版本要求（现在是 1.21），
          # check-latest 让它装最新的 1.2x 稳定版。
          # 不要写死具体补丁号 —— 云端缓存里未必有那个版本，会直接报错。
          go-version-file: go.mod
          check-latest: true
          cache: false

      # ---------------------------------------------------------------------
      # 把图标嵌进 exe。
      #
      # Go 链接器本身不会读 .ico，但 go build 会自动编译并链接当前目录下
      # 形如 rsrc_windows_amd64.syso 的资源目标文件 —— 这是 Go 官方的机制，
      # 所以只要先用 rsrc 把 .ico 转成 .syso 就行，源码一行都不用改。
      # ---------------------------------------------------------------------
      - name: 生成图标资源（rsrc_windows_amd64.syso）
        shell: cmd
        run: |
          go install github.com/akavel/rsrc@latest
          rsrc -ico assets\dming.ico -o rsrc_windows_amd64.syso -arch amd64
          rsrc -ico assets\dming.ico -o rsrc_windows_arm64.syso -arch arm64
          dir *.syso

      - name: 编译 windows/amd64
        shell: cmd
        run: |
          if not exist dist mkdir dist
          go build -trimpath -ldflags "-s -w" -o dist/dming-windows-amd64.exe .

      # 后缀 _windows_arm64 的 syso 只会在 GOOS=windows GOARCH=arm64 时被链接，
      # 所以两次编译各自吃到正确的图标，互不干扰。
      - name: 编译 windows/arm64
        shell: cmd
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          if not exist dist mkdir dist
          go build -trimpath -ldflags "-s -w" -o dist/dming-windows-arm64.exe .

      # 注意：Windows 上这两步的脚本必须是纯 ASCII。
      # GitHub Actions 把 run 块写成 UTF-8 文件，而 Windows PowerShell 5.1
      # 读无 BOM 的 .ps1 时按系统 ANSI 代码页解码，中文会变成
      # 「exe é‡Œæ²¡æœ‰...」这种乱码并直接语法报错。cmd.exe 同理（用 OEM 代码页）。
      # 要用中文就得走 pwsh（PowerShell 7，默认按 UTF-8 读脚本）。
      - name: 确认图标真的嵌进去了
        shell: powershell
        run: |
          # NOTE: this script is ASCII-only on purpose, see the comment above.
          #
          # Do NOT use ExtractAssociatedIcon to test for an icon: when a file has
          # no icon resource, Windows hands back the generic application icon
          # rather than $null, so such a test would always pass.
          # Parse the PE section table instead and require a .rsrc section --
          # the Go linker only emits that section when a rsrc_*.syso is linked.
          $exe = (Resolve-Path dist\dming-windows-amd64.exe).Path
          $fs = [IO.File]::OpenRead($exe)
          $br = New-Object IO.BinaryReader($fs)
          try {
            $fs.Position = 0x3C
            $peOff = $br.ReadInt32()
            $fs.Position = $peOff + 6
            $numSections = $br.ReadUInt16()
            $fs.Position = $peOff + 20
            $optSize = $br.ReadUInt16()
            $sectOff = $peOff + 24 + $optSize
            $names = @()
            for ($i = 0; $i -lt $numSections; $i++) {
              $fs.Position = $sectOff + $i * 40
              $names += ([Text.Encoding]::ASCII.GetString($br.ReadBytes(8))).TrimEnd([char]0)
            }
          } finally {
            $fs.Close()
          }

          Write-Host "PE sections: $($names -join ', ')"
          if ($names -notcontains '.rsrc') {
            throw "no .rsrc section found -- the icon was NOT linked into the exe"
          }
          Write-Host "OK: .rsrc present, the icon resource really is embedded"

          Add-Type -AssemblyName System.Drawing
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          Write-Host "Extracted icon size: $($ico.Width)x$($ico.Height)"

          # Smoke test: -h prints usage and exits 2, which is expected here.
          Write-Host "--- exe -h output ---"
          & $exe -h 2>&1 | Out-String | Write-Host

      - name: 组一个免安装绿色版
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/dming-portable | Out-Null
          Copy-Item dist/dming-windows-amd64.exe dist/dming-portable/dming.exe
          Copy-Item class.txt   dist/dming-portable/
          Copy-Item p.sample.txt dist/dming-portable/p.txt
          Copy-Item assets/dming.ico dist/dming-portable/

          $readme = @'
          免安装版，解压即用。

          1. 把 p.txt 换成你的名单（每行一个姓名）。
          2. 班级名称写在 class.txt 里。
          3. 双击 dming.exe 即可点名，页面会用默认浏览器打开。

          命令行参数：
            dming.exe -keep        保留生成的 HTML，不自动删除
            dming.exe -no-open     只生成 HTML，不打开浏览器
            dming.exe -delay 8s    延长清理前的等待时间

          注意 p.txt 和 class.txt 必须和 dming.exe 放在同一个文件夹里。
          '@
          # pwsh 的 utf8 是无 BOM 的 UTF-8，记事本可以正常识别。
          Set-Content -Path 'dist/dming-portable/使用说明.txt' -Value $readme -Encoding utf8
          Get-ChildItem dist/dming-portable | Format-Table Name, Length

      - name: 列出产物
        shell: cmd
        run: dir /b dist

      # 打成两个 zip，给 Release 用（Actions 的 Artifacts 会再包一层 zip，
      # 发布时直接给这两个更清爽）。
      # 用 pwsh 而不是 powershell：绿色版里有中文文件名，
      # PowerShell 5.1 在 zip 条目编码上会出问题，pwsh（.NET Core）不会。
      - name: 打包发布用 zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/dming-portable/* `
            -DestinationPath dist/dming-windows-portable.zip -Force
          Compress-Archive -Path dist/dming-windows-amd64.exe, dist/dming-windows-arm64.exe `
            -DestinationPath dist/dming-windows-exe.zip -Force

          # 把 zip 里的条目标题读回来核一遍。名字要是坏了就让 job 直接失败，
          # 而不是把乱码文件名的包发出去。
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = (Resolve-Path dist/dming-windows-portable.zip).Path
          $zip = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName })
          } finally {
            $zip.Dispose()
          }
          Write-Host "portable zip entries:"
          $entries | ForEach-Object { Write-Host "  $_" }
          if ($entries -notcontains '使用说明.txt') {
            throw "zip entry name came back mangled; expected 使用说明.txt"
          }
          Write-Host "OK: entry names survived the round trip"

          Get-ChildItem dist/*.zip | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: dming-windows
          if-no-files-found: error
          path: |
            dist/dming-windows-amd64.exe
            dist/dming-windows-arm64.exe
            dist/dming-portable/
            dist/*.zip

  # ---------------------------------------------------------------------------
  # 顺带交叉编译其他平台，跟 Windows 产物一起在 Actions 页面下载。
  # ---------------------------------------------------------------------------
  cross:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: android, goarch: arm64 }   # Termux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: 编译 ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o "dist/dming-${{ matrix.goos }}-${{ matrix.goarch }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: dming-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: dist/dming-${{ matrix.goos }}-${{ matrix.goarch }}

  # ---------------------------------------------------------------------------
  # 打 tag 时，把上面所有产物汇总成一个 Release。
  #
  # 只在 tag 上跑：普通 push 到 main 只构建，不发版。
  #
  # tag 约定是「提交的 7 位短 SHA」。这里会校验它确实对应本仓库的某个提交，
  # 并且是 HEAD 的祖先 —— 打错名字（比如手抖打成 56ad71）会直接报错，
  # 而不是发一个指向不存在提交的 Release。
  # ---------------------------------------------------------------------------
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, cross]
    runs-on: ubuntu-latest
    permissions:
      # 建 Release 需要写权限，只给这个 job。
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 取完整历史，下面要按 SHA 反查提交信息。
          fetch-depth: 0

      - name: 校验 tag 名是提交短 SHA
        id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if ! printf '%s' "$TAG" | grep -qE '^[0-9a-f]{4,40}$'; then
            echo "::error::tag 名 '$TAG' 不是十六进制短 SHA"
            exit 1
          fi

          # 反查这个短 SHA 对应的完整提交。找不到会非零退出。
          if ! FULL="$(git rev-parse --verify --quiet "${TAG}^{commit}")"; then
            echo "::error::tag 名 '$TAG' 在本仓库里找不到对应的提交，请检查是否打错"
            exit 1
          fi

          SHORT="$(git rev-parse --short=7 "$FULL")"
          echo "tag=$TAG"
          echo "完整 SHA=$FULL"
          echo "规范化短 SHA=$SHORT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 下载下来的目录结构是 artifacts/<artifact名>/<文件>。
      # 这里把要发布的东西挑出来，摊平到 release/ 下。
      - name: 整理发布文件
        run: |
          set -eux
          mkdir -p release
          # Windows 绿色版和 exe 合集
          cp artifacts/dming-windows/dming-windows-portable.zip release/
          cp artifacts/dming-windows/dming-windows-exe.zip release/
          # 其他平台，各自一个二进制
          for dir in artifacts/dming-linux-* artifacts/dming-darwin-* artifacts/dming-android-*; do
            [ -d "$dir" ] || continue
            for f in "$dir"/*; do
              [ -f "$f" ] && cp "$f" release/
            done
          done
          echo "--- 待发布文件 ---"
          ls -la release/

      - name: 生成 Release 说明
        env:
          FULL_SHA: ${{ steps.check.outputs.full }}
        run: |
          set -euo pipefail
          SUBJECT="$(git log -1 --pretty=%s "$FULL_SHA")"
          BODY="$(git log -1 --pretty=%b "$FULL_SHA")"
          AUTHOR="$(git log -1 --pretty=%an "$FULL_SHA")"
          DATE="$(git log -1 --pretty=%ad --date=short "$FULL_SHA")"

          {
            echo "提交 \`$FULL_SHA\` —— $DATE by $AUTHOR"
            echo
            echo "**$SUBJECT**"
            echo
            if [ -n "$BODY" ]; then
              echo "$BODY"
              echo
            fi
            echo "## 下载哪个"
            echo
            echo "| 文件 | 说明 |"
            echo "|---|---|"
            echo "| \`dming-windows-portable.zip\` | **推荐**。解压即用，把 \`p.txt\` 换成你的名单，双击 \`dming.exe\` |"
            echo "| \`dming-windows-exe.zip\` | 只要 exe（amd64 / arm64 两个），自己配 \`p.txt\`、\`class.txt\` |"
            echo "| \`dming-darwin-arm64\` / \`dming-darwin-amd64\` | macOS（Apple 芯片 / Intel） |"
            echo "| \`dming-linux-amd64\` / \`dming-linux-arm64\` | Linux |"
            echo "| \`dming-android-arm64\` | Termux |"
            echo
            echo "> macOS / Linux 首次运行可能需要去掉隔离属性："
            echo "> \`chmod +x dming-* && xattr -d com.apple.quarantine dming-darwin-arm64\`"
            echo
            echo "绿色版里的 \`p.txt\` 是示例名单（张三、李四、王五、赵六），不含任何真实数据。"
          } > release_body.md

          echo "--- 说明预览 ---"
          cat release_body.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.check.outputs.short }}
          tag_name: ${{ github.ref_name }}
          body_path: release_body.md
          files: release/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
